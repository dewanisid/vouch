[project]
name = "vouch"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.3.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]


[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
